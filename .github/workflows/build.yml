name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (framework-dependent, needs .NET 8 Desktop Runtime)
        run: dotnet publish src/MonitorFollow -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/fdd

      - name: Build (self-contained, no runtime needed)
        run: dotnet publish src/MonitorFollow -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o out/sc

      - name: Show sizes
        shell: pwsh
        run: Get-ChildItem out -Recurse -Filter *.exe | Select-Object FullName, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Rename artifacts
        shell: pwsh
        run: |
          Copy-Item out/fdd/MonitorFollow.exe out/MonitorFollow.exe
          Copy-Item out/sc/MonitorFollow.exe out/MonitorFollow-selfcontained.exe

      - uses: actions/upload-artifact@v4
        with:
          name: MonitorFollow
          path: |
            out/MonitorFollow.exe
            out/MonitorFollow-selfcontained.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/MonitorFollow.exe
            out/MonitorFollow-selfcontained.exe
          generate_release_notes: true
